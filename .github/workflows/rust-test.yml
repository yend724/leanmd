name: Rust Tests

on:
  push:
    branches: [develop]
    paths:
      - 'leanmd/**'
      - 'parser/**'
      - 'lexer/**'
      - '.github/workflows/rust-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'leanmd/**'
      - 'parser/**'
      - 'lexer/**'
      - '.github/workflows/rust-test.yml'

jobs:
  test:
    name: Test Rust Crates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [leanmd, parser, lexer]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        run: |
          rustup toolchain install 1.76.0 --profile minimal --component rustfmt,clippy
          rustup default 1.76.0

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: Run tests for ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo test --verbose

      - name: Run clippy for ${{ matrix.crate }}
        working-directory: ${{ matrix.crate }}
        run: cargo clippy -- -D warnings
