<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LeanMD シンプルデモ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#3498db',
              secondary: '#2980b9',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-100 text-gray-800 h-screen p-4 font-sans">
    <div
      class="max-w-6xl mx-auto bg-white rounded-lg shadow-md overflow-hidden h-full grid grid-rows-[auto_1fr]"
    >
      <header class="bg-primary text-white p-4 text-center">
        <h1 class="text-3xl font-bold">LeanMD</h1>
        <div class="text-sm mt-1">シンプルなMarkdownパーサー</div>
      </header>
      <div class="grid grid-cols-2 overflow-hidden">
        <div class="grid grid-rows-[auto_1fr] gap-4 p-4">
          <div class="pb-3 border-b border-gray-200">
            <h2 class="text-xl font-medium">Markdown入力</h2>
          </div>
          <div class="h-full overflow-auto border border-gray-20 rounded-sm">
            <textarea
              id="markdown-input"
              placeholder="Markdownを入力してください..."
              class="size-full p-4 text-sm bg-white resize-none block"
            >
# LeanMD

**シンプル**な*Markdown*パーサー

## 特徴

- Rust製
- WebAssemblyでブラウザで動作
- シンプルなAPI

## コード例

```rust
fn main() {
    println!("Hello, LeanMD!");
}
```

[リポジトリへのリンク](https://github.com/yend724/leanmd)</textarea
            >
          </div>
        </div>
        <div class="grid grid-rows-[auto_1fr] gap-4 p-4 h-full overflow-hidden">
          <div class="pb-3 border-b border-gray-200">
            <h2 class="text-xl font-medium">AST出力 (JSON)</h2>
          </div>
          <div
            class="border border-gray-200 bg-gray-100 h-full overflow-auto rounded-sm"
          >
            <pre
              id="ast-output"
              class="size-full p-4 text-sm resize-none whitespace-pre-wrap"
            >
解析を実行してください...</pre
            >
          </div>
        </div>
      </div>
    </div>
    <div
      id="loading"
      class="fixed inset-0 bg-white/80 flex items-center justify-center z-50"
      style="display: none"
    >
      <div class="flex items-center">
        <div
          class="w-6 h-6 border-2 border-gray-200 border-t-primary rounded-full animate-spin mr-3"
        ></div>
        <span class="text-gray-600 italic"
          >WebAssemblyモジュールを読み込み中...</span
        >
      </div>
    </div>
    <script type="module">
      // WASMモジュールのURLを指定
      const wasmModuleUrl = '../../leanmd/pkg/leanmd.js';

      // 初期化状態
      let isInitialized = false;
      let leanmd = null;

      // WASMモジュールを動的に読み込む関数
      async function loadWasmModule() {
        if (isInitialized) return;

        try {
          document.getElementById('loading').style.display = 'flex';

          // モジュールを動的にインポート
          const module = await import(wasmModuleUrl);
          await module.default();

          leanmd = module;

          isInitialized = true;
          document.getElementById('loading').style.display = 'none';

          // 初期解析を実行
          parseMarkdown();
        } catch (error) {
          console.error('Failed to load WASM module:', error);
          document.getElementById('loading').style.display = 'none';
          document.getElementById(
            'ast-output'
          ).textContent = `エラー: WebAssemblyモジュールの読み込みに失敗しました。\n${error.message}`;
        }
      }

      // Markdownを解析する関数
      function parseMarkdown() {
        if (!isInitialized) {
          loadWasmModule();
          return;
        }

        const markdownInput = document.getElementById('markdown-input').value;
        const astOutput = document.getElementById('ast-output');

        try {
          // ASTを取得
          const ast = leanmd.markdownToJSONPretty(markdownInput);

          // ASTをJSON文字列として表示
          astOutput.textContent = ast;
        } catch (error) {
          console.error('Error parsing markdown:', error);
          astOutput.textContent = `エラー: ${error.message}`;
        }
      }

      // マークダウン入力のイベントリスナー
      const inputElement = document.getElementById('markdown-input');
      inputElement.addEventListener('input', parseMarkdown);

      // 初期ロード
      loadWasmModule();
    </script>
  </body>
</html>
